on:
  push:
    branches:
      - '**'
    tags:
      - '**'
  pull_request:
    branches:
      - '**'
permissions:
  contents: read
  packages: write
env:
  factorio_password: ${{ secrets.FACTORIO_PASSWORD }}
  factorio_username: ${{ secrets.FACTORIO_USERNAME }}
  FSM_MODPACK_DIR: 'dev_pack'
  FSM_DIR: '../'
  FSM_CONF: '../../conf.json.example'
jobs:
  test-npm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26.3.1'
      - run: corepack enable
      - run: make app/bundle
  test-go:
    runs-on: ubuntu-latest
    name: test-go 1.26.4 (ubuntu-latest)
    steps:
      - uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: src/go.sum
      - run: |
          cd src
          if [[ -z "$factorio_password" ]]; then
            echo "run only short tests"
            go test ./... -v -test.short
          else
            echo "run full test suite"
            go test ./... -v
          fi
  docker-push:
    needs:  [test-npm, test-go]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v7
      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_REF_NAME//\//-}" >> "$GITHUB_ENV"
      - uses: actions/setup-node@v6
        with:
          node-version: '26.3.1'
      - run: corepack enable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: src/go.sum
      - name: Login to GHCR
        run: echo "$GH_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
        env:
          GH_TOKEN: ${{ github.token }}
      - run: make build; cp build/factorio-server-manager-linux.zip docker/factorio-server-manager-linux.zip
      - name: Build and push Docker image
        run: |
          docker buildx create --use
          docker buildx build \
            --file ./docker/Dockerfile-local \
            --tag ghcr.io/dnaroma/factorio-server-manager:$IMAGE_TAG \
            --push \
            ./docker/
