on:
  release:
    types: [published]
permissions:
  contents: write
  packages: write
jobs:
  add-assets-to-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26.3.1'
      - run: corepack enable
      - uses: actions/setup-go@v6
      - name: Get git tag
        id: tag_name
        uses: little-core-labs/get-git-tag@v3.0.2
      - name: Get release
        id: get_release
        uses: bruceadams/get-release@v1.2.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Create release bundles
        run: make gen_release
      - name: Upload release (linux)
        uses: actions/upload-release-asset@v1.0.2
        env:
          GITHUB_TOKEN: ${{ github.token }}
        with:
          upload_url: ${{ steps.get_release.outputs.upload_url }}
          asset_path: ./build/factorio-server-manager-linux.zip
          asset_name: factorio-server-manager-linux-${{ steps.tag_name.outputs.tag }}.zip
          asset_content_type: application/octet-stream
  docker-push:
    needs: ['add-assets-to-release']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26.3.1'
      - run: corepack enable
      - uses: actions/setup-go@v6
      - uses: docker/setup-buildx-action@v1
      - name: Get git tag
        id: tag_name
        uses: little-core-labs/get-git-tag@v3.0.2
      - name: Login to GHCR
        uses: docker/login-action@v1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: make build; cp build/factorio-server-manager-linux.zip docker/factorio-server-manager-linux.zip
      - uses: docker/build-push-action@v2
        with:
          context: ./docker/
          file: ./docker/Dockerfile-local
          push: true
          tags: ghcr.io/dnaroma/factorio-server-manager:latest,ghcr.io/dnaroma/factorio-server-manager:${{ steps.tag_name.outputs.tag }}
