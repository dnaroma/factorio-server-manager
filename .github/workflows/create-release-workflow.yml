on:
  release:
    types: [published]
permissions:
  contents: write
  packages: write
jobs:
  add-assets-to-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26.3.1'
      - run: corepack enable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: src/go.sum
      - name: Create release bundles
        run: make gen_release
      - name: Upload release (linux)
        run: gh release upload "$GITHUB_REF_NAME" ./build/factorio-server-manager-linux.zip#factorio-server-manager-linux-$GITHUB_REF_NAME.zip --clobber
        env:
          GH_TOKEN: ${{ github.token }}
  docker-push:
    needs: ['add-assets-to-release']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '26.3.1'
      - run: corepack enable
      - uses: actions/setup-go@v6
        with:
          go-version: '1.26.4'
          cache-dependency-path: src/go.sum
      - uses: docker/setup-buildx-action@v3
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - run: make build; cp build/factorio-server-manager-linux.zip docker/factorio-server-manager-linux.zip
      - uses: docker/build-push-action@v6
        with:
          context: ./docker/
          file: ./docker/Dockerfile-local
          push: true
          tags: ghcr.io/dnaroma/factorio-server-manager:latest,ghcr.io/dnaroma/factorio-server-manager:${{ github.ref_name }}
